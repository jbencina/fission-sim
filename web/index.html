<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c1e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%230a84ff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%230a84ff'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>fission-sim · PWR simulator</title>
    <script>
      // Apply the saved or system theme before first paint, so the page never
      // flashes the wrong colours. Mirrors resolveTheme() in src/theme/themeStore.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('fission-sim:theme') || 'system'
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
